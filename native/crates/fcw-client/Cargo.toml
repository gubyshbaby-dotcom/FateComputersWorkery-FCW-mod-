[package]
name = "fcw-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FCW client native library (JNI) and shared QUIC session code"

[lib]
name = "fcw_client"
crate-type = ["cdylib", "rlib"]

[features]
default = ["audio", "video"]
audio = ["dep:opus"]
# Декодер видеорежима экрана (H.264, OpenH264 из исходников).
video = ["dep:openh264"]

[dependencies]
fcw-proto = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zstd = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
jni = "0.21"
jpeg-decoder = { version = "0.3", default-features = false }
opus = { workspace = true, optional = true }
openh264 = { workspace = true, optional = true }
