[package]
name = "fcw-net"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.80"
description = "FCW: userspace L2 switch, DHCP/DNS gateway and NAT with firewall for QEMU guests"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
ipnet = "2"
if-addrs = "0.15"
bytes = "1"
parking_lot = "0.12"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
