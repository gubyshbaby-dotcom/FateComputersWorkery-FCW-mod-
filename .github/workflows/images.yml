name: Guest images

# Образы большие и собираются долго, поэтому только вручную или по тегу.
on:
  workflow_dispatch:
    inputs:
      distros:
        description: "Дистрибутивы через пробел"
        default: "fedora ubuntu arch"
        required: true
      publish:
        description: "Выложить в релиз images"
        type: boolean
        default: false
  push:
    tags: ["images-*"]

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p fcw-agent --target x86_64-unknown-linux-musl
        working-directory: native
      - uses: actions/upload-artifact@v4
        with:
          name: fcw-agent
          path: native/target/x86_64-unknown-linux-musl/release/fcw

  image:
    needs: agent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, ubuntu, arch]
    steps:
      - name: Skip unselected
        id: sel
        run: |
          want="${{ github.event.inputs.distros || 'fedora ubuntu arch' }}"
          if [[ " $want " == *" ${{ matrix.distro }} "* ]]; then echo "run=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.sel.outputs.run
      - uses: actions/download-artifact@v4
        if: steps.sel.outputs.run
        with:
          name: fcw-agent
          path: agent
      - name: Free disk space
        if: steps.sel.outputs.run
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Tools
        if: steps.sel.outputs.run
        run: sudo apt-get update && sudo apt-get install -y qemu-utils zstd e2fsprogs xz-utils
      - name: Build ${{ matrix.distro }}
        if: steps.sel.outputs.run
        run: |
          chmod +x agent/fcw
          sudo FCW_AGENT_BIN="$PWD/agent/fcw" ./images/build-image.sh ${{ matrix.distro }} "$PWD/out" "$RUNNER_TEMP/work"
          sudo chown -R "$USER" out
      - uses: actions/upload-artifact@v4
        if: steps.sel.outputs.run
        with:
          name: fcw-image-${{ matrix.distro }}
          path: out/fcw-image-${{ matrix.distro }}.tar.zst
          compression-level: 0
      - name: Publish
        if: steps.sel.outputs.run && (startsWith(github.ref, 'refs/tags/images-') || github.event.inputs.publish == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: images
          name: Guest images
          files: out/fcw-image-${{ matrix.distro }}.tar.zst
