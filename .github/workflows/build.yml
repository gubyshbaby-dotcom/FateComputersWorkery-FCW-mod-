name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["images/**", "docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# новая сборка той же ветки отменяет предыдущую
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # libopus (через крейт opus) объявляет старый cmake_minimum_required,
  # CMake 4 без этого отказывается его собирать
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # nasm: ассемблерные части OpenH264 (видеорежим экрана); без него кодек
      # собирается без SIMD, и тесты с кодированием идут в разы медленнее
      - run: sudo apt-get update && sudo apt-get install -y qemu-utils cmake nasm
      - run: cargo fmt --check
        working-directory: native
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: native
      - run: cargo test --workspace
        working-directory: native

  natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64,   runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { platform: linux-aarch64,  runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, optional: true }
          - { platform: windows-x86_64, runner: windows-latest,   target: x86_64-pc-windows-msvc }
          - { platform: macos-aarch64,  runner: macos-latest,     target: aarch64-apple-darwin }
          - { platform: macos-x86_64,   runner: macos-latest,     target: x86_64-apple-darwin, optional: true }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.target }}
      # OpenH264 (видеорежим экрана, крейт openh264-sys2) собирается из исходников
      # компилятором C++ раннера. Для x86_64 его ассемблерные части собирает nasm;
      # если nasm нет, крейт молча собирает кодек без SIMD (в разы медленнее),
      # поэтому ставим nasm; если не вышло, сборка идёт дальше с предупреждением.
      # На aarch64 (Linux, macOS) ассемблер NEON собирает сам компилятор C, nasm
      # не нужен.
      # Если кодек на какой-то платформе не соберётся, её можно собрать без него:
      #   cargo build ... --no-default-features --features fcw-daemon/audio,fcw-client/audio
      - name: Install nasm (x86_64 targets)
        if: ${{ startsWith(matrix.target, 'x86_64') }}
        continue-on-error: true
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y nasm ;;
            macOS)   brew install nasm ;;
            Windows) choco install nasm -y --no-progress && echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
                     export PATH="$PATH:/c/Program Files/NASM" ;;
          esac
          nasm -v || echo "::warning::nasm is not available: OpenH264 is built without assembly, video mode will be slow"
      - name: Build daemon and client library
        shell: bash
        working-directory: native
        run: cargo build --release --target ${{ matrix.target }} -p fcw-daemon -p fcw-client
      - name: Collect
        shell: bash
        run: |
          out="natives/${{ matrix.platform }}"
          mkdir -p "$out"
          rel="native/target/${{ matrix.target }}/release"
          for f in fcw-daemon fcw-daemon.exe libfcw_client.so fcw_client.dll libfcw_client.dylib; do
            [ -f "$rel/$f" ] && cp "$rel/$f" "$out/"
          done
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: natives

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p fcw-agent --target x86_64-unknown-linux-musl
        working-directory: native
      - uses: actions/upload-artifact@v4
        with:
          name: fcw-agent
          path: native/target/x86_64-unknown-linux-musl/release/fcw

  mod:
    needs: [natives, agent]
    # собираем jar с теми нативами, что получились (ARM-раннеры есть не везде)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: natives
          merge-multiple: true
      # агент гостя едет в jar как natives/guest-x86_64/fcw: мод обновляет им агент внутри ВМ
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fcw-agent
          path: natives/guest-x86_64
      - run: ls -R natives
      - name: Build mod jar
        working-directory: mod
        run: ./gradlew build --no-daemon -Pfcw.nativesDir="$GITHUB_WORKSPACE/natives"
      - uses: actions/upload-artifact@v4
        with:
          name: fcw-mod
          path: mod/build/libs/*.jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mod/build/libs/*.jar
