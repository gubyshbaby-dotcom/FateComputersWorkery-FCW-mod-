# FCW: Alacritty — единственный эмулятор терминала в образе.
[env]
TERM = "xterm-256color"

[window]
padding = { x = 8, y = 6 }
dynamic_padding = true
opacity = 0.96
title = "Alacritty"
dimensions = { columns = 100, lines = 30 }

[font]
size = 10.5
normal = { family = "DejaVu Sans Mono", style = "Book" }

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 600

[colors.primary]
background = "#1b1f27"
foreground = "#d8dee9"

[colors.cursor]
cursor = "@ACCENT@"
text = "#1b1f27"

[colors.selection]
background = "@ACCENT@"
text = "#ffffff"

[colors.normal]
black = "#2b303b"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#c678dd"
cyan = "#56b6c2"
white = "#d8dee9"

[colors.bright]
black = "#5c6370"
red = "#ff7a85"
green = "#b5e890"
yellow = "#ffd88a"
blue = "#82c4ff"
magenta = "#de9bf0"
cyan = "#7fd6e0"
white = "#ffffff"
