[General]
__userfile__=true

[panel1]
alignment=-1
animation-duration=0
background-color=@Variant(\0\0\0\x43\x1\xff\xff\x1b\x1b\x1f\x1f\x27\x27\0\0)
background-image=
desktop=0
font-color=@Variant(\0\0\0\x43\x1\xff\xff\xd8\xd8\xde\xde\xe9\xe9\0\0)
hidable=false
hide-on-overlap=false
iconSize=22
lineCount=1
lockPanel=false
opacity=100
panelSize=34
plugins=mainmenu, quicklaunch, taskbar, statusnotifier, volume, worldclock
position=Bottom
reserve-space=true
show-delay=0
visible-margin=true
width=100
width-percent=true

[mainmenu]
alignment=Left
filterClear=true
icon=/usr/share/fcw/menu.png
ownIcon=true
showText=false
type=mainmenu

[quicklaunch]
alignment=Left
apps\1\desktop=/usr/share/applications/Alacritty.desktop
apps\2\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\size=2
type=quicklaunch

[taskbar]
alignment=Left
buttonWidth=200
raiseOnCurrentDesktop=true
showOnlyOneDesktopTasks=false
type=taskbar

[statusnotifier]
alignment=Right
type=statusnotifier

[volume]
alignment=Right
audioEngine=PulseAudio
type=volume

[worldclock]
alignment=Right
type=worldclock
